<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Notes Dashboard</title>

    <link rel="stylesheet" href="todo.css">
    <script src="todo.js" defer></script>
</head>

<body>
    <div class="dashboard">

        <!-- Top navigation bar -->
        <header class="topbar">
            <div class="window-dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search..."
                    aria-label="Search tasks"
                >
            </div>

            <div class="profile">
                <span>My Dashboard</span>
                <div class="avatar">C</div>
            </div>
        </header>

        <div class="main-layout">

            <!-- Sidebar -->
            <aside class="sidebar">
                <h2 class="sidebar-title">My Notes</h2>

                <nav class="sidebar-nav">
                    <button class="nav-item active" data-view="Notes">
                        <span>▤</span> Notes
                    </button>

                    <button class="nav-item" data-view="Calendar">
                        <span>▦</span> Calendar
                    </button>

                    <button class="nav-item" data-view="Archived">
                        <span>▣</span> Archived
                    </button>

                    <button class="nav-item" data-view="Trash">
                        <span>▤</span> Trash
                    </button>
                </nav>

                <button class="nav-item settings" id="settingsButton">
                    <span>⚙</span> Settings
                </button>
            </aside>

            <!-- Main content -->
            <main class="content">

                <div class="toolbar">
                    <div class="filters" aria-label="Task status filters">
                        <button class="filter-btn selected"
                            data-filter="all">All</button>

                        <button class="filter-btn"
                            data-filter="active">Active</button>

                        <button class="filter-btn"
                            data-filter="completed">Completed</button>
                    </div>

                    <div class="toolbar-actions">
                        <label class="sort-control">
                            Sort
                            <select id="sortSelect" aria-label="Sort tasks">
                                <option value="default">By Date</option>
                                <option value="title">By Title</option>
                            </select>
                        </label>
                    </div>
                </div>

                <p id="taskSummary" class="task-summary"
                    aria-live="polite"></p>

                <!-- Add-task form -->
                <form id="taskForm" class="task-form" hidden>
                    <h2>Add a new task</h2>

                    <label for="taskTitle">Title</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter task title"
                        maxlength="100"
                    >

                    <label for="taskDescription">Description</label>
                    <textarea
                        id="taskDescription"
                        placeholder="What do you need to do?"
                        rows="3"
                        maxlength="300"
                    ></textarea>

                    <label for="taskCategory">Category</label>
                    <select id="taskCategory">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Family">Family</option>
                    </select>

                    <p id="taskError" class="error-message"
                        role="alert"></p>

                    <div class="form-buttons">
                        <button type="submit" class="primary-btn">
                            Add Task
                        </button>

                        <button type="button" id="cancelButton"
                            class="secondary-btn">
                            Cancel
                        </button>
                    </div>
                </form>

                <!-- JavaScript creates all task cards here -->
                <section
                    id="taskList"
                    class="task-grid"
                    aria-label="Tasks"
                ></section>

                <p id="emptyMessage" class="empty-message" hidden>
                    No tasks found. Add a task to get started!
                </p>

                <!-- Floating add button -->
                <button
                    id="addButton"
                    class="add-button"
                    aria-label="Add a task"
                    title="Add a task"
                >+</button>

            </main>
        </div>
    </div>
</body>
</html>
